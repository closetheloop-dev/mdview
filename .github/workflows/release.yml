# Release: push a tag v<x.y.z> (matching package.json "version") to build all
# platform binaries, package them (scripts/package-binaries.sh), and create a
# GitHub release with the tar.gz archives + SHA256SUMS.txt attached.
#
# Flow: bump "version" in package.json -> commit -> git tag v<x.y.z> ->
# git push --tags. The first step hard-fails on tag/version mismatch.
#
# The release step (softprops/action-gh-release) authenticates with the
# built-in GITHUB_TOKEN, which needs the "contents: write" permission below.
name: release

on:
  push:
    tags: ["v*"]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Verify tag matches package.json version
        run: |
          pkg="$(sed -n 's/.*"version": *"\([^"]*\)".*/\1/p' package.json | head -1)"
          tag="${GITHUB_REF_NAME#v}"
          if [ "$pkg" != "$tag" ]; then
            echo "tag (v$tag) does not match package.json version ($pkg)" >&2
            exit 1
          fi

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Cross-compile all platform binaries
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          target: export
          build-args: |
            VERSION=${{ github.ref_name }}
          outputs: type=local,dest=./out

      - name: Smoke test linux-x64 binary
        run: |
          ./out/linux-x64/mdview --version | grep -F "${{ github.ref_name }}"

      - name: Package release assets
        run: bash scripts/package-binaries.sh "$GITHUB_REF_NAME"

      - name: Create GitHub release and attach assets
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: assets/*
