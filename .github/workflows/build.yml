# CI build: on every push/PR, cross-compile all release binaries via the
# Dockerfile (which also runs lint + typecheck + tests as build gates) and
# smoke-test the linux-x64 binary. Publishing releases lives in release.yml.
name: build

on:
  push:
    branches: ["main", "master"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Cross-compile all platform binaries
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          target: export
          outputs: type=local,dest=./out

      - name: Smoke test linux-x64 binary
        run: |
          ./out/linux-x64/mdview --version
          ./out/linux-x64/mdview demo.md | head -20

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: binaries
          path: out/
